name: Build Invest AI APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check source ZIP
        run: test -f InvestAI_SOURCE.zip

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q InvestAI_SOURCE.zip -d project
          find project -maxdepth 3 -type f -name gradlew -print

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          ROOT="$(dirname "$(find project -type f -name gradlew -print -quit)")"
          test -n "$ROOT"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestAI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
