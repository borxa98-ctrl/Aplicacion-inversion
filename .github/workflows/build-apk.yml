name: Build Invest AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check source ZIP
        run: |
          test -f InvestAI_SOURCE.zip
          echo "Source ZIP found"

      - name: Unpack project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q InvestAI_SOURCE.zip -d project
          echo "Gradle wrappers found:"
          find project -type f -name gradlew -print

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          ROOT="$(dirname "$(find project -type f -name gradlew -print -quit)")"
          test -n "$ROOT"
          echo "Gradle project: $ROOT"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestAI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
