name: Build Invest AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "InvestAI_SOURCE.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project from source ZIP
        run: |
          test -f InvestAI_SOURCE.zip
          mkdir -p _android_build
          unzip -q InvestAI_SOURCE.zip -d _android_build
          test -f _android_build/investai_fix/gradlew

      - name: Build debug APK
        working-directory: _android_build/investai_fix
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestAI-Android-v3.0.0-debug
          path: _android_build/investai_fix/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
