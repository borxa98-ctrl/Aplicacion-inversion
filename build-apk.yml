name: Build Invest AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check source ZIP
        run: | test -f InvestAI_SOURCE.zip echo "Source ZIP found" 
      - name: Unpack project
        run: | rm -rf project mkdir -p project unzip -q InvestAI_SOURCE.zip -d project echo "Project contents:" find project -maxdepth 2 -type f | head -100 
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: | yes | sdkmanager --licenses >/dev/null || true sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 
      - name: Make Gradle executable
        working-directory: project
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: | find project -type f -name "*.apk" -print 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestAI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
